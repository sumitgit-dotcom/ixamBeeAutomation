name: ixamBee CI - Cross-Browser Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  test:
    name: Run Selenium Tests on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false   # run all browsers even if one fails
      matrix:
        browser: [ chrome, firefox ]
        # For Edge on Linux, add "edge" only if you install msedgedriver

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Install browsers available on ubuntu-latest
      - name: Install Google Chrome
        if: matrix.browser == 'chrome'
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox

      # 4. Run the tests using the browser system property
      - name: Run tests - ${{ matrix.browser }}
        run: mvn clean test -Dbrowser=${{ matrix.browser }} -B

      # 5. Upload Cucumber HTML report on every run
      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: target/cucumber-reports/
          if-no-files-found: warn

      # 6. Upload TestNG / Surefire reports
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.browser }}
          path: target/surefire-reports/
          if-no-files-found: warn